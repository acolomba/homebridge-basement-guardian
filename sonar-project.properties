# SonarCloud configuration for homebridge-basement-guardian.
sonar.projectKey=acolomba_homebridge-basement-guardian
sonar.organization=acolomba

# Project metadata.
sonar.projectName=Homebridge Basement Guardian
# Keep in lockstep with package.json's "version" field.
sonar.projectVersion=0.1.1

# Source code settings.
sonar.sources=src
sonar.tests=test,features
sonar.sourceEncoding=UTF-8

# Coverage settings.
sonar.javascript.lcov.reportPaths=coverage/unit.lcov

# Exclusions.
sonar.exclusions=.planning/**,dist/**,dist-test/**,coverage/**,node_modules/**
sonar.test.exclusions=test/**,features/**

# Issue exclusions.
# S5332 flags GRANT_TYPE in src/cloud/auth.ts as an insecure http:// URL. It is
# Auth0's own documented OAuth grant_type identifier for the password-realm
# extension grant -- an opaque constant string Auth0's server matches
# verbatim, not an endpoint this plugin contacts. Changing it to https://
# would break authentication.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=src/cloud/auth.ts
