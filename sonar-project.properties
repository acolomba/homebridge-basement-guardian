# SonarCloud configuration for homebridge-basement-guardian.
sonar.projectKey=acolomba_homebridge-basement-guardian
sonar.organization=acolomba

# Project metadata.
sonar.projectName=Homebridge Basement Guardian
# Keep in lockstep with package.json's "version" field.
sonar.projectVersion=0.1.0

# Source code settings.
sonar.sources=src
sonar.tests=test,features
sonar.sourceEncoding=UTF-8

# Coverage settings.
sonar.javascript.lcov.reportPaths=coverage/unit.lcov

# Exclusions.
sonar.exclusions=.planning/**,dist/**,dist-test/**,coverage/**,node_modules/**
sonar.test.exclusions=test/**,features/**
