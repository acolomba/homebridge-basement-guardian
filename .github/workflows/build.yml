name: Build and Lint

on:
  # Scoped to the default branch and pull requests, so a feature-branch push
  # does not spend a full matrix run before the work is ready for review.
  # Use `workflow_dispatch` to gate a branch on demand.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # A hung test is a reachable failure here, not a hypothetical: a case that
    # waited on an unref'd timer left a promise pending rather than failing.
    # Without this, such a run burns the default six hours before anyone knows.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # D-032: Node 20 left Homebridge support in April 2026, and
        # `engines.node` is `^22.10.0 || ^24.0.0 || ^26.0.0`. Node 22 is also
        # the version Homebridge 1.8 and 2.x both accept, so dropping 20
        # costs no Homebridge 1.x coverage. Node 26 joined once Homebridge's
        # own `engines.node` started accepting it.
        node-version: [22.x, 24.x, 26.x]
        # D-02/D-033: the three pinned compatibility boundary points --
        # minimum-supported 1.8.x, latest 1.x, and current 2.x. The 1.8.0
        # cell prints a benign `npm warn EBADENGINE` during install, because
        # Homebridge 1.8.0's own `engines.node` is `^18.15.0 || ^20.7.0` and
        # this repository sets no `engine-strict`; the warning is expected
        # and does not fail the job.
        homebridge-version: ['1.8.0', '1.11.4', '2.4.0']

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Pin matrix-selected Homebridge version
        # --no-save keeps package-lock.json's own ^2.4.0 pin untouched by CI.
        run: npm install --no-save homebridge@${{ matrix.homebridge-version }}

      - name: Lint the project
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Check code health
        run: npm run fallow

      - name: Run tests
        run: npm test

      - name: Build the project
        run: npm run build

      - name: List outdated dependencies
        # Informational only: `npm list --outdated` exits 1 whenever any
        # dependency has a newer version available, which is not a build
        # failure.
        continue-on-error: true
        run: npm list --outdated

      - name: Audit production dependencies for known vulnerabilities
        run: npm audit --omit=dev
