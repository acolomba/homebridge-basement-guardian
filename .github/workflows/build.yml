name: Build and Lint

on:
  # Scoped to the default branch and pull requests, so a feature-branch push
  # does not spend a full matrix run before the work is ready for review.
  # Use `workflow_dispatch` to gate a branch on demand.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # A hung test is a reachable failure here, not a hypothetical: a case that
    # waited on an unref'd timer left a promise pending rather than failing.
    # Without this, such a run burns the default six hours before anyone knows.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # D-032: Node 20 left Homebridge support in April 2026, and
        # `engines.node` is `^22.10.0 || ^24.0.0`. Node 22 is also the version
        # Homebridge 1.8 and 2.x both accept, so dropping 20 costs no
        # Homebridge 1.x coverage.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Lint the project
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Check code health
        run: npm run fallow

      - name: Run tests
        run: npm test

      - name: Build the project
        run: npm run build

      - name: List, audit, fix outdated dependencies and build again
        run: |
          npm list --outdated
          npm audit || true  # ignore failures
          npm audit fix || true
          npm list --outdated
          npm run build
