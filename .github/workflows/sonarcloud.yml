name: SonarCloud Analysis

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    # Secrets are unavailable to Dependabot and fork-originated PRs.
    if: >-
      github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # No token or run-id override: download only from this workflow run.
      - name: Download accepted direct coverage
        uses: actions/download-artifact@v8
        with:
          name: direct-coverage-lcov
          path: coverage

      - name: Require the coverage report
        run: test -s coverage/direct.lcov

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          # Called from ci.yml, so the event is CI's. push and pull_request already
          # carry branch/PR context, and naming a branch on a pull_request breaks PR
          # decoration. workflow_dispatch carries no such context, so without this
          # the run is recorded against the project's main branch.
          args: ${{ github.event_name == 'workflow_dispatch' && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
