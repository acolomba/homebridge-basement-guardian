name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          # CI/check runs the full npm gate. These hooks remain enabled for local
          # commits.
          SKIP: prettier,npm-check

  fallow-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run fallow audit
        id: fallow
        uses: fallow-rs/fallow@71369f80d099e25726ad04382f15aef14a251abc # v3.31.0
        with:
          command: audit
          format: github-annotations

      - name: Fail on a Fallow warning
        if: steps.fallow.outputs.verdict == 'warn' || steps.fallow.outputs.analysis-degraded == 'true'
        env:
          VERDICT: ${{ steps.fallow.outputs.verdict }}
          DEGRADED: ${{ steps.fallow.outputs.analysis-degraded }}
        run: |
          echo "::error::Fallow audit verdict: ${VERDICT}. Degraded analysis: ${DEGRADED}."
          exit 1
