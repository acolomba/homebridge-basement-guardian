exclude: ^(\.agents/|\.claude/|\.codex/|\.pi/)

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=64"]
        exclude: ^(package-lock\.json|\.planning/)
      - id: check-json
      - id: check-yaml
      - id: check-ast
      - id: sort-simple-yaml
      - id: check-vcs-permalinks
      - id: forbid-submodules
      - id: forbid-new-submodules

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
        exclude: ^(\.github/ISSUE_TEMPLATE/|\.planning/)
      - id: alphabetize-codeowners
      - id: fix-spaces
      - id: fix-unicode-dashes
        exclude: ^(\.github/ISSUE_TEMPLATE/|\.planning/)
      - id: fix-ligatures
        exclude: ^\.planning/
      - id: forbid-bidi-controls

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.97.9
    hooks:
      - id: trufflehog
        entry: trufflehog filesystem --results=verified,unknown --fail --no-update
        pass_filenames: true
        stages: [pre-commit]

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["--strict", "-d", "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable, comments: {min-spaces-from-content: 1}}}"]
        exclude: ^\.copier-answers\.yml$

  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
        exclude: ^\.copier-answers\.yml$

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-gfm-alerts
          - mdformat-footnote
        exclude: ^(\.github/ISSUE_TEMPLATE/|\.planning/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^(\.github/ISSUE_TEMPLATE/|\.planning/)

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        # --no-progress is repeated here. Setting args replaces the upstream list
        # instead of adding to it.
        args: ["--no-progress", "--config", "zizmor.yml"]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write --cache --cache-strategy content
        language: system
        files: '\.(js|json|mjs|ts)$'
      # CI runs the complete gate on every pull request, including deletions.
      - id: npm-check
        name: npm run check:commit
        entry: npm run check:commit
        language: system
        pass_filenames: false
        files: '^(\.editorconfig|\.fallowrc\.json|\.gitattributes|\.gitignore|\.prettierignore|\.prettierrc\.json|eslint\.config\.js|package(-lock)?\.json|sonar-project\.properties|tsconfig(\.build|\.test)?\.json|cucumber\.json|(src|test|features|\.github/workflows)/.*|scripts/.*\.mjs|config\.schema\.json)$'
