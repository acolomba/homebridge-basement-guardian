exclude: ^(\.agents/|\.claude/|\.codex/)

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=64"]
        exclude: ^(package-lock\.json|\.planning/)
      - id: check-json
      - id: check-yaml
      - id: check-ast
      - id: sort-simple-yaml
      - id: check-vcs-permalinks
      - id: forbid-submodules
      - id: forbid-new-submodules

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: '\.(js|json|mjs|ts)$'
        # Pin prettier to match the npm devDependency (the mirror otherwise
        # floats and CI resolved a version that reformats TS union types
        # differently from the local check).
        additional_dependencies:
          - prettier@3.9.6

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
        exclude: ^(\.github/ISSUE_TEMPLATE/|\.planning/)
      - id: alphabetize-codeowners
      - id: fix-spaces
      - id: fix-unicode-dashes
        exclude: ^(\.github/ISSUE_TEMPLATE/|\.planning/)
      - id: fix-ligatures
        exclude: ^\.planning/
      - id: forbid-bidi-controls

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.92.4
    hooks:
      - id: trufflehog

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        args: ["-d", "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}"]

  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-frontmatter
          - mdformat-gfm
          - mdformat-gfm-alerts
        exclude: ^(\.github/ISSUE_TEMPLATE/|\.planning/)

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.20.0
    hooks:
      - id: markdownlint-cli2
        exclude: ^(\.github/ISSUE_TEMPLATE/|\.planning/)

  - repo: local
    hooks:
      # Each hook runs the whole project because pass_filenames is false.
      # The files pattern only determines whether the hook runs. Include every
      # source path and configuration file that can change the tool result.
      #
      # Pre-commit does not select deleted files. Thus, a delete-only commit can
      # skip these hooks. CI must run the complete npm check as the merge gate.
      - id: npm-lint
        name: npm lint
        entry: npm run lint
        language: system
        pass_filenames: false
        files: '^(eslint\.config\.js|tsconfig\.json|(src|test|features)/.*\.(mjs|ts)|package(-lock)?\.json)$'
      - id: npm-format-check
        name: npm format check
        entry: npm run format:check
        language: system
        pass_filenames: false
        files: '^(\.prettierrc\.json|\.prettierignore|eslint\.config\.js|(src|test|features)/.*\.(mjs|ts)|package(-lock)?\.json|tsconfig\.json)$'
      - id: npm-typecheck
        name: npm typecheck
        entry: npm run typecheck
        language: system
        pass_filenames: false
        files: '^((src|test|features)/.*\.(mjs|ts)|package(-lock)?\.json|tsconfig\.json)$'
      - id: npm-fallow
        name: npm fallow
        entry: npm run fallow
        language: system
        pass_filenames: false
        files: '^(\.fallowrc\.json|tsconfig\.json|eslint\.config\.js|(src|test|features)/.*\.(mjs|ts)|package(-lock)?\.json)$'
